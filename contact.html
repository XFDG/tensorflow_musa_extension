<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <title>Haoran Feng — AI Infra Lab</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#07090d;color:#f2f5f7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#183448 0,transparent 34%),#07090d}
    main{width:min(680px,calc(100% - 40px));padding:48px;border:1px solid #ffffff1f;border-radius:24px;background:#0d121acc;box-shadow:0 28px 90px #0008}
    .mark{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#9db3ff,#78e3c5);color:#081016;font-weight:800;margin-bottom:28px}
    h1{font-size:clamp(28px,6vw,48px);line-height:1.08;margin:0 0 16px}p{color:#aab4c2;line-height:1.75;margin:0}.bar{height:3px;background:#ffffff17;border-radius:99px;overflow:hidden;margin-top:30px}.bar::after{content:"";display:block;width:42%;height:100%;background:linear-gradient(90deg,#9db3ff,#78e3c5);animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(140%)}}
    a{color:#9db3ff}.error{display:none;margin-top:22px;color:#ffb7b7}
  </style>
</head>
<body>
  <main>
    <div class="mark">HF</div>
    <h1>正在打开 Haoran's AI Infra Lab</h1>
    <p>正在加载项目、经历与技术文章。首次访问只需下载一个约 40 KB 的站点包。</p>
    <div class="bar" aria-label="加载中"></div>
    <p class="error" id="error">页面加载失败。可以先访问 <a href="https://github.com/XFDG">GitHub</a>，或发送邮件至 <a href="mailto:225010160@link.cuhk.edu.cn">225010160@link.cuhk.edu.cn</a>。</p>
  </main>
  <script>
  (async () => {
    const repo = 'tensorflow_musa_extension';
    const parts = ['site.part01a.b64','site.part01b.b64','site.part01c.b64','site.part01d.b64','site.part02.b64','site.part03.b64','site.part04.b64'];
    const segments = location.pathname.split('/').filter(Boolean);
    const repoIndex = segments.indexOf(repo);
    const base = repoIndex >= 0 ? '/' + segments.slice(0, repoIndex + 1).join('/') + '/' : '/';
    try {
      if (!('DecompressionStream' in window)) throw new Error('Browser does not support gzip streams');
      const encoded = (await Promise.all(parts.map(async name => {
        const response = await fetch(base + name, {cache: 'force-cache'});
        if (!response.ok) throw new Error('Missing site bundle: ' + name);
        return response.text();
      }))).join('').replace(/\s/g, '');

      const binary = atob(encoded);
      const compressed = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) compressed[i] = binary.charCodeAt(i);
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const archive = new Uint8Array(await new Response(stream).arrayBuffer());
      const decoder = new TextDecoder();
      const files = new Map();
      const field = (start, length) => decoder.decode(archive.subarray(start, start + length)).split('\0')[0].trim();
      let offset = 0;
      while (offset + 512 <= archive.length) {
        const name = field(offset, 100);
        if (!name) break;
        const prefix = field(offset + 345, 155);
        const fullName = (prefix ? prefix + '/' : '') + name;
        const size = parseInt(field(offset + 124, 12) || '0', 8) || 0;
        const type = field(offset + 156, 1);
        const dataStart = offset + 512;
        if (!type || type === '0') files.set(fullName.replace(/^\.\//, ''), archive.slice(dataStart, dataStart + size));
        offset = dataStart + Math.ceil(size / 512) * 512;
      }

      let requested = repoIndex >= 0 ? segments.slice(repoIndex + 1).join('/') : segments.join('/');
      if (!requested || requested.endsWith('/')) requested += 'index.html';
      if (!files.has(requested)) requested = '404.html';

      const text = path => decoder.decode(files.get(path));
      const objectUrl = (path, type) => URL.createObjectURL(new Blob([files.get(path)], {type}));
      const cssUrl = objectUrl('styles.css', 'text/css');
      const jsUrl = objectUrl('script.js', 'text/javascript');
      const iconUrl = objectUrl('assets/favicon.svg', 'image/svg+xml');
      const manifestUrl = objectUrl('assets/site.webmanifest', 'application/manifest+json');

      let html = text(requested)
        .replace(/href=(['"])(?:\.\.\/)?styles\.css\1/g, `href="${cssUrl}"`)
        .replace(/src=(['"])(?:\.\.\/)?script\.js\1/g, `src="${jsUrl}"`)
        .replace(/href=(['"])(?:\.\.\/)?assets\/favicon\.svg\1/g, `href="${iconUrl}"`)
        .replace(/href=(['"])(?:\.\.\/)?assets\/site\.webmanifest\1/g, `href="${manifestUrl}"`);

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error(error);
      document.querySelector('.bar').style.display = 'none';
      document.querySelector('#error').style.display = 'block';
    }
  })();
  </script>
</body>
</html>
