name: Publish personal website

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: personal-website-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Expand the static website bundle
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'site.part*.b64' > /dev/null; then
            cat site.part01a.b64 site.part01b.b64 site.part01c.b64 site.part01d.b64 \
                site.part02.b64 site.part03.b64 site.part04.b64 \
              | tr -d '[:space:]' | base64 --decode > /tmp/haoran-site.tar.gz
            rm -rf /tmp/haoran-site
            mkdir -p /tmp/haoran-site
            tar -xzf /tmp/haoran-site.tar.gz -C /tmp/haoran-site

            find . -mindepth 1 -maxdepth 1 \
              ! -name .git ! -name .github -exec rm -rf {} +
            cp -a /tmp/haoran-site/. .

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Expand static website source' || true
            git push origin HEAD:gh-pages
          fi

      - name: Enable GitHub Pages from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! output="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f 'source[branch]=gh-pages' -f 'source[path]=/' 2>&1)"; then
            if grep -Eqi 'already exists|status.?409|HTTP 409' <<<"$output"; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
                -f 'source[branch]=gh-pages' -f 'source[path]=/' >/dev/null
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true

      - name: Verify the public website
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://xfdg.github.io/tensorflow_musa_extension/
        shell: bash
        run: |
          set -euo pipefail
          live=false
          http_status=000
          for attempt in $(seq 1 36); do
            http_status="$(curl -L -sS -o /tmp/site-index.html -w '%{http_code}' "$SITE_URL" || true)"
            if [[ "$http_status" == 200 ]] && grep -q 'Haoran' /tmp/site-index.html; then
              live=true
              break
            fi
            sleep 5
          done

          pages_status="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.status // "unknown"' 2>/dev/null || echo unknown)"
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployment-status.json <<JSON
          {
            "live": ${live},
            "url": "${SITE_URL}",
            "http_status": "${http_status}",
            "pages_status": "${pages_status}",
            "checked_at": "${checked_at}"
          }
          JSON

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-status.json
          git commit -m 'Record website deployment status' || true
          git push origin HEAD:gh-pages
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true

          if [[ "$live" != true ]]; then
            echo "Public site verification did not reach HTTP 200." >&2
            exit 1
          fi
